<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.55" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="soft" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="rgba(191,0,255,0.14)"/>
      <stop offset="0.4" stop-color="rgba(0,255,255,0.10)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="1350" fill="url(#bg)"/>
  <rect width="900" height="1350" fill="url(#soft)"/>

  <g filter="url(#glow)">
    <path d="M170 740 C270 590, 420 560, 560 640 C690 720, 740 860, 640 960 C540 1060, 330 1030, 240 900"
      fill="none" stroke="rgba(0,255,255,0.55)" stroke-width="10" stroke-linecap="round"/>
    <path d="M210 780 C310 650, 450 640, 560 710"
      fill="none" stroke="rgba(57,255,20,0.35)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <text x="90" y="170" fill="#e7e7e7" font-size="26" font-family="ui-monospace, Menlo, Monaco, monospace" opacity="0.85">
    SOFT FUTURE / HUMAN SIGNAL
  </text>

  <text x="90" y="1050" fill="#ffffff" font-size="110" font-weight="850"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    Her
  </text>
  <text x="92" y="1108" fill="#cfd4dc" font-size="30"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" opacity="0.9">
    y · 2013
  </text>

  <text x="90" y="1230" fill="#9aa3b2" font-size="22" font-family="ui-monospace, Menlo, Monaco, monospace">
    Technology, but tender.
  </text>
</svg>

