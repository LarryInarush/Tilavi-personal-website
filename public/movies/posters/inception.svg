<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff14"/>
      <stop offset="0.5" stop-color="#00ffff"/>
      <stop offset="1" stop-color="#bf00ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="1350" fill="url(#bg)"/>
  <rect width="900" height="1350" fill="url(#grid)" opacity="0.35"/>

  <circle cx="690" cy="260" r="210" fill="rgba(57,255,20,0.10)"/>
  <circle cx="270" cy="1040" r="250" fill="rgba(191,0,255,0.10)"/>

  <g filter="url(#glow)">
    <path d="M120 760 C240 560, 380 540, 520 620 C640 690, 720 680, 820 560"
      fill="none" stroke="url(#neon)" stroke-width="10" stroke-linecap="round"/>
    <path d="M120 820 C260 700, 400 700, 520 780 C650 870, 720 860, 820 720"
      fill="none" stroke="rgba(0,255,255,0.55)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="90" y="170" fill="#e7e7e7" font-size="26" font-family="ui-monospace, Menlo, Monaco, monospace" opacity="0.85">
    DREAMS / STACK / EXECUTE
  </text>

  <text x="90" y="1050" fill="#ffffff" font-size="86" font-weight="700"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="1">
    Inception
  </text>
  <text x="92" y="1108" fill="#cfd4dc" font-size="30"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" opacity="0.9">
    ×¦zô · 2010
  </text>

  <text x="90" y="1230" fill="#9aa3b2" font-size="22" font-family="ui-monospace, Menlo, Monaco, monospace">
    A layered heist in the subconscious.
  </text>
</svg>

