<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.6" stop-color="#0b0b10"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="1350" fill="url(#bg)"/>

  <g filter="url(#glow)">
    <circle cx="450" cy="520" r="230" fill="rgba(57,255,20,0.10)"/>
    <circle cx="450" cy="520" r="180" fill="rgba(0,255,255,0.08)"/>
    <path d="M260 520H640" stroke="#39ff14" stroke-width="12" stroke-linecap="round"/>
    <path d="M310 460H590" stroke="rgba(255,0,255,0.55)" stroke-width="10" stroke-linecap="round"/>
    <path d="M310 580H590" stroke="rgba(0,255,255,0.55)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <text x="90" y="170" fill="#e7e7e7" font-size="26" font-family="ui-monospace, Menlo, Monaco, monospace" opacity="0.85">
    PRACTICE / BLEED / REPEAT
  </text>

  <text x="90" y="1050" fill="#ffffff" font-size="92" font-weight="800"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
