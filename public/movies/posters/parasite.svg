<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.5" stop-color="#0a1014"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="bars" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="10" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>

  <rect width="900" height="1350" fill="url(#bg)"/>
  <rect width="900" height="1350" fill="url(#bars)" opacity="0.55"/>

  <g filter="url(#glow)">
    <rect x="130" y="300" width="640" height="520" rx="30" fill="rgba(255,255,255,0.03)" stroke="rgba(57,255,20,0.55)" stroke-width="6"/>
    <rect x="170" y="360" width="560" height="70" rx="18" fill="rgba(0,255,255,0.18)"/>
    <rect x="170" y="470" width="420" height="70" rx="18" fill="rgba(191,0,255,0.16)"/>
    <rect x="170" y="580" width="520" height="70" rx="18" fill="rgba(57,255,20,0.12)"/>
    <rect x="170" y="690" width="380" height="70" rx="18" fill="rgba(0,255,255,0.12)"/>
  </g>

  <text x="90" y="170" fill="#e7e7e7" font-size="26" font-family="ui-monospace, Menlo, Monaco, monospace" opacity="0.85">
    UP / DOWN / INVISIBLE WALL
  </text>

  <text x="90" y="1050" fill="#ffffff" font-size="92" font-weight="800"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    Parasite
  </text>
  <text x="92" y="1108" fill="#cfd4dc" font-size="30"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" opacity="0.9">
    Äk · 2019
  </text>

  <text x="90" y="1230" fill="#9aa3b2" font-size="22" font-family="ui-monospace, Menlo, Monaco, monospace">
    The house is a diagram.
  </text>
</svg>

