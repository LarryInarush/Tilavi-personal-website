<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.5" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff00ff"/>
      <stop offset="0.5" stop-color="#00ffff"/>
      <stop offset="1" stop-color="#39ff14"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="1" y="0" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="900" height="1350" fill="url(#bg)"/>
  <rect width="900" height="1350" fill="url(#scan)" opacity="0.55"/>

  <g filter="url(#glow)">
    <rect x="110" y="260" width="680" height="420" rx="26" fill="rgba(0,0,0,0.18)" stroke="url(#neon)" stroke-width="8"/>
    <path d="M160 620 L740 320" stroke="rgba(0,255,255,0.35)" stroke-width="6"/>
    <path d="M160 320 L740 620" stroke="rgba(57,255,20,0.25)" stroke-width="6"/>
  </g>

  <text x="90" y="170" fill="#e7e7e7" font-size="26" font-family="ui-monospace, Menlo, Monaco, monospace" opacity="0.85">
    NEON / NOIR / QUIET PANIC
  </text>

  <text x="90" y="1040" fill="#ffffff" font-size="74" font-weight="750"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    Blade Runner 2049
  </text>
  <text x="92" y="1096" fill="#cfd4dc" font-size="30"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" opacity="0.9">
    φό@K 2049 · 2017
  </text>

  <text x="90" y="1230" fill="#9aa3b2" font-size="22" font-family="ui-monospace, Menlo, Monaco, monospace">
    The city hums. The soul echoes.
  </text>
</svg>

