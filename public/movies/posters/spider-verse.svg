<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.55" stop-color="#141018"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.8" fill="rgba(255,255,255,0.07)"/>
      <circle cx="13" cy="10" r="1.2" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <rect width="900" height="1350" fill="url(#bg)"/>
  <rect width="900" height="1350" fill="url(#dots)" opacity="0.9"/>

  <g filter="url(#glow)">
    <path d="M120 760 C260 520, 460 520, 600 690 C720 840, 790 840, 840 720"
      fill="none" stroke="rgba(255,0,255,0.70)" stroke-width="10" stroke-linecap="round"/>
    <path d="M120 690 C300 480, 520 470, 700 610"
      fill="none" stroke="rgba(0,255,255,0.65)" stroke-width="8" stroke-linecap="round"/>
    <path d="M120 860 C320 720, 520 730, 700 850"
      fill="none" stroke="rgba(57,255,20,0.55)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <text x="90" y="170" fill="#e7e7e7" font-size="26" font-family="ui-monospace, Menlo, Monaco, monospace" opacity="0.85">
    HALFTONE / FLOW / MULTIVERSE
  </text>

  <text x="90" y="1040" fill="#ffffff" font-size="70" font-weight="820"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    SpiderVerse
  </text>
  <text x="92" y="1096" fill="#cfd4dc" font-size="30"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" opacity="0.9">
    sL‡™ · 2018
  </text>

  <text x="90" y="1230" fill="#9aa3b2" font-size="22" font-family="ui-monospace, Menlo, Monaco, monospace">
    Comic grain in motion.
  </text>
</svg>

