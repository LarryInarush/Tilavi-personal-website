<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.55" stop-color="#060b18"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="30%" r="60%">
      <stop offset="0" stop-color="rgba(0,255,255,0.18)"/>
      <stop offset="0.4" stop-color="rgba(57,255,20,0.08)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="stars" width="140" height="140" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="40" r="1.2" fill="rgba(255,255,255,0.45)"/>
      <circle cx="80" cy="20" r="1.6" fill="rgba(255,255,255,0.35)"/>
      <circle cx="120" cy="90" r="1.1" fill="rgba(255,255,255,0.30)"/>
      <circle cx="40" cy="120" r="1.4" fill="rgba(255,255,255,0.28)"/>
    </pattern>
  </defs>

  <rect width="900" height="1350" fill="url(#bg)"/>
  <rect width="900" height="1350" fill="url(#stars)" opacity="0.65"/>
  <rect width="900" height="1350" fill="url(#halo)"/>

  <g filter="url(#glow)">
    <circle cx="450" cy="520" r="210" fill="none" stroke="rgba(0,255,255,0.65)" stroke-width="10"/>
    <circle cx="450" cy="520" r="260" fill="none" stroke="rgba(191,0,255,0.25)" stroke-width="6"/>
    <path d="M200 730 C300 630, 600 630, 700 730" fill="none" stroke="#39ff14" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
  </g>

  <text x="90" y="170" fill="#e7e7e7" font-size="26" font-family="ui-monospace, Menlo, Monaco, monospace" opacity="0.85">
    TIME DILATION / LOVE SIGNAL
  </text>

  <text x="90" y="1050" fill="#ffffff" font-size="84" font-weight="700"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    Interstellar
  </text>
  <text x="92" y="1108" fill="#cfd4dc" font-size="30"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" opacity="0.9">
    EŠ · 2014
  </text>

  <text x="90" y="1230" fill="#9aa3b2" font-size="22" font-family="ui-monospace, Menlo, Monaco, monospace">
    We are not meant to save the world alone.
  </text>
</svg>

